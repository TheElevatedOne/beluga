<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Beluga: a Breeze-style folder with a beluga's head on the front, after the layout of Dolphin's icon. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2e7ec6"/>
      <stop offset="1" stop-color="#2a76ba"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ebebeb"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ba1ea"/>
      <stop offset="0.55" stop-color="#3a8ad3"/>
      <stop offset="1" stop-color="#2870af"/>
    </linearGradient>
    <!-- the front flap: lower on the left, a slanted step, then straight to the right edge -->
    <clipPath id="flap">
      <path d="M6 58 H42 L50 49 H122 V113 Q122 115 120 115 H8 Q6 115 6 113 Z"/>
    </clipPath>
  </defs>
  <!-- back with tab -->
  <path d="M8 11 H55 L63 20 H120 Q122 20 122 22 V113 H6 V13 Q6 11 8 11 Z" fill="url(#back)"/>
  <path d="M8 11 H55 L63 20 H120 Q122 20 122 22 V23 Q122 21 120 21 H62.5 L54.5 12 H8 Q6 12 6 14 V13 Q6 11 8 11 Z" fill="#ffffff" opacity="0.25"/>
  <!-- sheet of paper -->
  <rect x="12" y="29" width="104" height="40" fill="url(#sheet)"/>
  <!-- front flap -->
  <path d="M6 58 H42 L50 49 H122 V113 Q122 115 120 115 H8 Q6 115 6 113 Z" fill="url(#front)"/>
  <path d="M6 58 H42 L50 49 H122 V50.5 H50.7 L42.7 59.5 H6 Z" fill="#ffffff" opacity="0.3"/>
  <path d="M6 113 Q6 115 8 115 H120 Q122 115 122 113 V112 H6 Z" fill="#000000" opacity="0.1"/>
  <!-- beluga: a whole whale swimming across the flap, tail flukes raised on the left, round melon and short
       beak on the right -->
  <g clip-path="url(#flap)">
    <g transform="translate(0 4)" fill="#ffffff" opacity="0.38">
      <path d="M25 74 C20 69 13 66 6 66 C9 60 17 59 23 64 C25 58 30 55 36 55 C34 61 30 67 27 74 Z"/>
      <path d="M24 72 C34 76 46 69 64 67 C84 64 104 66 112 76 C116 81 115 86 111 88 C116 89 118 92 115 95 C105 100 88 102 72 100 C52 98 36 90 26 79 Z"/>
      <path d="M80 99 C79 104 75 108 69 110 C70 105 72 101 75 99 Z"/>
    </g>
    <g transform="translate(0 4)">
      <!-- smile -->
      <path d="M113 93 C106 95.5 99 95 94 92.5" fill="none" stroke="#358cda" stroke-width="2" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="98" cy="79" r="3.4" fill="#358cda"/>
    </g>
  </g>
</svg>
